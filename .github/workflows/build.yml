name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            cli

      # kora-cli vai junto no instalador como sidecar (tauri externalBin exige o sufixo do target).
      - name: kora-cli
        shell: bash
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = "Windows" ] && echo .exe || true)
          mkdir -p src-tauri/binaries
          cp "cli/target/release/kora-cli$ext" "src-tauri/binaries/kora-cli-$triple$ext"

      - run: npm ci
      - run: npm run check
      - name: Testes Rust
        if: runner.os == 'Linux'
        run: |
          cargo test --manifest-path cli/Cargo.toml
          npm run build && cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: kora-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
